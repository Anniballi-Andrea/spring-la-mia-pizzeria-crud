<!DOCTYPE html>
<html lxmls:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/style :: style}"></th:block>
    <title>Modifica offerta</title>
</head>

<body>
    <header>
        <th:block th:replace="~{fragments/nav :: nav}"></th:block>
    </header>
    <main>
        <div class="container">
            <form id="add-offer-form" th:action="@{/offer/edit/{id}(id=${offer.id})}" th:object="${offer}"
                method="post">
                <div class="text-center mt-5">
                    <h3>Modifica un offerta a: pizza [[${offer.getPizza().getName()}]]</h3>
                </div>
                <input type="hidden" th:field="*{pizza}">
                <div class="row cols-3 mt-5 py-4 border">
                    <div class="col">
                        <label class="form-label" for="offerName">Nome dell' offerta:</label>
                        <input class="form-control" type="text" id="offerName" placeholder="nome offerta"
                            th:field="*{offerName}" th:errorClass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('offerName')}">
                            <ul>
                                <li th:each="error : ${#fields.errors('offerName')}" th:text="${error}" />
                            </ul>
                        </div>
                    </div>
                    <div class="col">
                        <label class="form-label" for="start">Inizio offerta:</label>
                        <input class="form-control" type="date" id="start" th:field="*{start}"
                            th:errorClass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('start')}">
                            <ul>
                                <li th:each="error : ${#fields.errors('start')}" th:text="${error}" />
                            </ul>
                        </div>
                    </div>
                    <div class="col">
                        <label class="form-label" for="end">Fine offerta:</label>
                        <input class="form-control" type="date" id="end" th:field="*{end}" th:errorClass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('end')}">
                            <ul>
                                <li th:each="error : ${#fields.errors('end')}" th:text="${error}" />
                            </ul>
                        </div>
                    </div>
                    <div class="d-flex justify-content-center pt-4">
                        <button class="btn btn-primary btn-sm">confirm</button>
                    </div>

                </div>

            </form>
        </div>


    </main>
</body>



</html>
