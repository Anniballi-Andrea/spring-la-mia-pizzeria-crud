<!DOCTYPE html>
<html lxmls:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/style :: style}"></th:block>
    <title>ingridients</title>
</head>

<body>
    <header>
        <th:block th:replace="~{fragments/nav :: nav}"></th:block>
    </header>
    <main style="margin-bottom: 10rem;">


        <div class="container mt-5 mb-5">
            <div class="d-flex justify-content-between">
                <div>
                    <h1>Lista Ingredienti:</h1>
                </div>
            </div>
            <div class="mt-3">
                <a class="btn btn-primary" th:href="@{/ingridients/create}"><i class="bi bi-plus-square"></i></a>
            </div>

            <table class="table" th:if="${ingridients.size() > 0}">
                <thead>
                    <tr>
                        <th>nome</th>
                        <th>numero pizze</th>
                        <th>Modifica</th>
                        <th>Elimina</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ingridient : ${ingridients}" th:object="${ingridient}">

                        <td>[[*{name}]]</td>
                        <td>[[${ingridient.pizzas.size()}]]</td>

                        <td><a th:href="@{/ingridients/edit/{id}(id=${ingridient.id})}"
                                class="btn btn-success btn-sm"><i class="bi bi-pencil"></i></a>
                        </td>
                        <td>
                            <form action="#" th:action="@{/ingridients/delete/{id}(id=${ingridient.id})}" method="post">
                                <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash3"></i>

                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="text-center mt-3">
                <p class="fs-3 fw-bold" th:if="${ingridients.size() == 0}">Al momento non abbiamo ingredienti</p>
            </div>

        </div>
    </main>
</body>

</html>
