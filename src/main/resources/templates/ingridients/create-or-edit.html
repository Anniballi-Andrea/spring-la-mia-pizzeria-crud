<!DOCTYPE html>
<html lxmls:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/style :: style}"></th:block>
    <title>Aggiungi offerta</title>
</head>

<body>
    <header>
        <th:block th:replace="~{fragments/nav :: nav}"></th:block>
    </header>
    <main>
        <div class="container">
            <form id="add-offer-form"
                th:action="${edit} ? @{|/ingridients/edit/${ingridient.id}|} : @{/ingridients/create}"
                th:object="${ingridient}" method="post">
                <div th:if="${edit}" class="text-center mt-5">
                    <h3>Modifica l'ingrediente: [[${ingridient.name}]]</h3>
                </div>
                <div th:unless="${edit}" class="text-center mt-5">
                    <h3>Aggiungere un ingrediente</h3>
                </div>
                <input type="hidden" th:field="*{id}">
                <div class="row cols-3 mt-5 py-4 border justify-content-center">
                    <div class="col-4">
                        <label class="form-label text-center" for="name">Nome ingrediente</label>
                        <input class="form-control" type="text" id="name" placeholder="ingrediente" th:field="*{name}"
                            th:errorClass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}">
                            <ul>
                                <li th:each="error : ${#fields.errors('name')}" th:text="${error}" />
                            </ul>
                        </div>
                    </div>
                    <div class="d-flex justify-content-center pt-4">
                        <button class="btn btn-primary btn-sm">confirm</button>
                    </div>

                </div>

            </form>
        </div>


    </main>
</body>



</html>
